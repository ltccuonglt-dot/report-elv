<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c2d8f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Report ELV — Cập nhật</title>
<style>
  :root{--brand:#7c2d8f;--ink:#241a2b;--muted:#6f6478;--bg:#f2eef4;--card:#fff}
  @media (prefers-color-scheme:dark){:root{--ink:#f1e9f5;--muted:#b9aec2;--bg:#17121b;--card:#231b29}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;
    background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .card{width:100%;max-width:400px;background:var(--card);border-radius:22px;padding:28px 22px;text-align:center;
    box-shadow:0 20px 44px -20px rgba(40,10,60,.45)}
  img{width:68px;height:68px;border-radius:16px}
  h1{font-size:21px;margin:14px 0 8px}
  p{margin:0 0 10px;color:var(--muted);font-size:15px;line-height:1.5}
  button{width:100%;margin-top:12px;padding:14px;border:none;border-radius:14px;background:var(--brand);color:#fff;
    font:700 16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;cursor:pointer}
  .link{font-size:13px;color:var(--muted);margin-top:14px;word-break:break-all}
</style>
</head>
<body>
<div class="card" role="dialog" aria-labelledby="t">
  <img src="icon-192.png" alt="">
  <h1 id="t">Report ELV có bản cập nhật</h1>
  <p>App đã chuyển sang <b>link mới, bảo mật hơn</b>. Dữ liệu vẫn giữ nguyên.</p>
  <p>Bấm <b>Cập nhật</b>, sau đó ở app mới bấm <b>"Cài app bản mới"</b> để lưu biểu tượng mới.</p>
  <button type="button" id="go">Cập nhật</button>
  <div class="link" id="lnk"></div>
</div>
<script>
// Link cũ (github.io) → popup yêu cầu cập nhật → sang link mới, mang theo thiết lập máy
// (chỉ các khoá an toàn, link mới cũng chỉ nhận đúng danh sách này).
var NEW_URL = 'https://report-elv-app.pages.dev/';
document.getElementById('lnk').textContent = 'Link mới: ' + NEW_URL.replace(/^https:\/\//, '').replace(/\/$/, '');
function payload(){
  var o = {}, ok = /^kt_(eng|cus|display_mode|ctp_zoom|store|pg_[a-z]+)$/;
  try{
    for (var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i), v = localStorage.getItem(k);
      if (ok.test(k) && v != null && v.length < 500) o[k] = v;
    }
  }catch(e){}
  var b = btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  return b.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
var inApp = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
document.getElementById('go').onclick = function(){
  var url = NEW_URL + '#mig=' + payload();
  if (inApp){
    // Đang trong cửa sổ app CŨ: mở bản mới bằng trình duyệt (cài được app mới, không dính thanh
    // địa chỉ của app cũ), rồi tự đóng cửa sổ app cũ.
    var w = window.open(url, '_blank'); // không dùng 'noopener' vì khi đó window.open luôn trả null
    if (w) { try{ w.opener = null; }catch(e){} }
    document.querySelector('.card').innerHTML = '<img src="icon-192.png" alt=""><h1>Đã mở bản mới</h1>'
      + '<p>Bản mới đã mở trong trình duyệt. Ở đó bấm <b>"Cài app bản mới"</b> để có biểu tượng mới.</p>'
      + '<p>Sau đó <b>gỡ app cũ</b> này (trình duyệt không cho web tự gỡ app):</p>'
      + '<p style="text-align:left;font-size:14px">💻 <b>Máy tính</b>: bấm <b>⋮</b> hoặc <b>Uninstall</b> trên thanh tiêu đề cửa sổ này → <b>Gỡ cài đặt</b>.<br>'
      + '📱 <b>Android</b>: nhấn giữ biểu tượng app cũ → <b>Gỡ cài đặt</b>.<br>'
      + '🍎 <b>iPhone</b>: nhấn giữ biểu tượng app cũ → <b>Xoá ứng dụng</b>.</p>';
    setTimeout(function(){ try{ window.close(); }catch(e){} }, 1500);
    if (!w) location.replace(url); // trình duyệt chặn cửa sổ mới thì mở ngay tại đây
  } else {
    location.replace(url);
  }
};
</script>
</body>
</html>
